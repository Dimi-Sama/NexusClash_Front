stages:
  - install
  - build

install-job:
  stage: install
  image: node:20.18.0-slim
  script:
    - npm install
  artifacts:
    paths:
      - node_modules

build-job:
  stage: build
  image: node:20.18.0-slim
  dependencies:
    - install-job
  script:
    - npm run build
  artifacts:
    paths:
      - dist